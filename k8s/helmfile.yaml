repositories:
- name: argo
  url: https://argoproj.github.io/argo-helm
- name: cilium
  url: https://helm.cilium.io/

releases:
# Bootstrap only: once running, ArgoCD manages Cilium through k8s/apps/cilium/application.yaml.
# Keep the version in sync with that Application.
- name: cilium
  namespace: kube-system
  createNamespace: true
  chart: cilium/cilium
  version: 1.20.5
  wait: true
  waitForJobs: true
  values:
  - ipam:
      mode: kubernetes
  - kubeProxyReplacement: true
  - securityContext:
      capabilities:
        ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
        cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  - cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
  - k8sServiceHost: localhost
  - k8sServicePort: 7445
  - gatewayAPI:
      enabled: true
      enableAlpn: true
      enableAppProtocol: true
  - bgpControlPlane:
      enabled: true

- name: argocd
  namespace: argocd
  createNamespace: true
  chart: argo/argo-cd
  version: 10.18.2
  values:
  - redis-ha:
      enabled: true
      haproxy:
        deploymentStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
  - controller:
      replicas: 1
  - server:
      replicas: 2
  - repoServer:
      replicas: 2
  - applicationSet:
      replicas: 2
  - global:
      networkPolicy:
        create: false
