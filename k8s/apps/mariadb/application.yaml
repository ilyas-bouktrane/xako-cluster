apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
  - repoURL: https://github.com/ilyas-bouktrane/xako-cluster.git
    targetRevision: HEAD
    path: k8s/apps/mariadb/manifests
  - chart: mariadb-operator-crds
    repoURL: https://helm.mariadb.com/mariadb-operator
    targetRevision: 26.10.2
    helm:
      releaseName: mariadb-operator-crds
  - chart: mariadb-operator
    repoURL: https://helm.mariadb.com/mariadb-operator
    targetRevision: 26.10.2
    helm:
      releaseName: mariadb-operator
      values: |
        ha:
          enabled: true
          replicas: 3
        # 3 replicas with required anti-affinity on 3 workers: a surge pod can never be scheduled,
        # so replace pods one at a time instead
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - mariadb-operator
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                  - mariadb-operator
              topologyKey: kubernetes.io/hostname
        pdb:
          enabled: true
          maxUnavailable: 1
  - chart: mariadb-cluster
    repoURL: https://helm.mariadb.com/mariadb-operator
    targetRevision: 26.10.2
    helm:
      releaseName: mariadb-cluster
      values: |
        mariadb:
          image: mariadb:11.8.9 # LTS line; pinned so operator upgrades never change the server version
          updateStrategy:
            autoUpdateDataPlane: true # keep agent/init containers in sync with operator upgrades (required by 26.10)
          replicas: 1
          galera:
            enabled: false
          storage:
            size: 10Gi
            storageClassName: longhorn
          rootPasswordSecretKeyRef:
            name: mariadb-secret
            key: root-password
            generate: false
        databases:
        - name: seafile-db
        - name: seahub-db
        - name: ccnet-db
        users:
        - name: seafile
          passwordSecretKeyRef:
            name: mariadb-secret
            key: seafile-password
          host: "%"
          maxUserConnections: 0
        grants:
        - name: seafile
          privileges:
          - "ALL PRIVILEGES"
          database: "*"
          table: "*"
          username: seafile
          host: "%"
          grantOption: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: mariadb
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
