apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  sources:
  - chart: longhorn
    repoURL: https://charts.longhorn.io/
    targetRevision: v1.12.0
    helm:
      releaseName: longhorn
      values: |
        persistence:
          defaultClass: false
        preUpgradeChecker:
          jobEnabled: false
  - repoURL: https://github.com/ilyas-bouktrane/xako-cluster.git
    targetRevision: HEAD
    path: k8s/apps/longhorn/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
