apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navidrome-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ilyas-bouktrane/xako-cluster.git
    targetRevision: HEAD
    path: k8s/apps/navidrome/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: navidrome
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
